<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gameboy3 — Apprendre, le parcours</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="garde.js"></script>
<style>
  body { margin: 0; background: #14161b; color: #e6e9ef; font-family: 'Segoe UI', system-ui, sans-serif; }
  main { max-width: 560px; margin: 80px auto; padding: 0 16px; line-height: 1.5; }
  a { color: #9bbc5a; }
</style>
</head>
<body>
<main>
  <h1>Le cours a rejoint le parcours</h1>
  <p>Les leçons et le cours ne font plus qu’une seule suite : <strong>Apprendre — le parcours</strong>.
    Chaque cours y est, tout entier, à sa place parmi les leçons.</p>
  <p><a id="aller" href="tuto.html">Ouvrir le parcours →</a></p>
</main>

<script type="module">
/*
 * L'ancienne page du cours mène au parcours (tuto.html), et à la même étape :
 * « cours.html#lecon-7 » — le 7e cours — ouvre ce cours-là, à sa nouvelle
 * place. On le retrouve par son titre, qui n'a pas changé.
 */
import { COURS } from './tuto/programmation.js'
import { LECONS } from './tuto/lecons.js'

const demande = Number((location.hash.match(/lecon-(\d+)/) ?? [])[1])
const cours = COURS[demande - 1] ?? COURS[0]
const place = LECONS.findIndex((l) => l.titre === cours.titre)
const adresse = 'tuto.html' + (place >= 0 ? `#lecon-${place + 1}` : '')
document.getElementById('aller').href = adresse
location.replace(adresse)
</script>
</body>
</html>
