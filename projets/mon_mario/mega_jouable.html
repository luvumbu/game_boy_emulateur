<p>Flèches pour bouger · X = A · Z = B · Entrée = START · Maj = SELECT — clique une fois pour activer le son.</p>

var TAC_PERIODS = [1024, 16, 64, 256];
var Timer = class {
  divider = 0;
  counter = 0;
  // TIMA
  modulo = 0;
  // TMA
  control = 0;
  // TAC
  tick = 0;
  reset() {
    this.divider = 43980;
    this.counter = 0;
    this.modulo = 0;
    this.control = 0;
    this.tick = 0;
  }
  /** Advances by `cycles` T-cycles; returns the interrupt bits to raise. */
  step(cycles) {
    this.divider = this.divider + cycles & 65535;
    if ((this.control & 4) === 0) return 0;
    let interrupts = 0;
    const period = TAC_PERIODS[this.control & 3];
    this.tick += cycles;
    while (this.tick >= period) {
      this.tick -= period;
      this.counter++;
      if (this.counter > 255) {
        this.counter = this.modulo;
        interrupts |= TIMER_INTERRUPT;
      }
    }
    return interrupts;
  }
  read(address) {
    switch (address) {
      case 65284:
        return this.divider >> 8 & 255;
      case 65285:
        return this.counter;
      case 65286:
        return this.modulo;
      case 65287:
        return this.control | 248;
      default:
        return 255;
    }
  }
  write(address, value) {
    switch (address) {
      case 65284:
        this.divider = 0;
        this.tick = 0;
        break;
      case 65285:
        this.counter = value & 255;
        break;
      case 65286:
        this.modulo = value & 255;
        break;
      case 65287:
        this.control = value & 7;
        break;
    }
  }
};

var GameBoy = class {
  apu = new Apu();
  ppu = new Ppu();
  timer = new Timer();
  joypad = new Joypad();
  mmu = new Mmu(this.ppu, this.timer, this.joypad, this.apu);
  cpu = new Cpu(this.mmu);
  /** Cycles carried over from the previous frame. */
  carry = 0;
  loadRom(rom) {
    this.mmu.loadRom(rom);
    this.reset();
  }
  reset() {
    this.apu.reset();
    this.ppu.reset();
    this.timer.reset();
    this.joypad.reset();
    this.mmu.reset();
    this.cpu.reset();
    this.carry = 0;
  }
  setButton(button, isDown) {
    this.joypad.setPressed(button, isDown);
  }
  releaseAllButtons() {
    this.joypad.releaseAll();
  }
  /** Runs one instruction and advances the other chips by the cycles it took. */
  stepInstruction() {
    const cycles = this.cpu.step();
    this.apu.step(cycles);
    this.mmu.requestInterrupt(this.ppu.step(cycles));
    this.mmu.requestInterrupt(this.timer.step(cycles));
    return cycles;
  }

   * Advances until the PPU finishes a frame. Falls back to a cycle budget so a
   * ROM stuck in a loop with the LCD off cannot hang the browser tab.
   */
  runFrame() {
    this.ppu.frameReady = false;
    let cycles = this.carry;
    while (!this.ppu.frameReady && cycles < CYCLES_PER_FRAME * 2) {
      cycles += this.stepInstruction();

    this.carry = this.ppu.frameReady ? Math.max(0, cycles - CYCLES_PER_FRAME) : 0;

  }

    return this.ppu.framebuffer;
  }

  source.connect(volume)
  const maintenant = audio.currentTime
  if (curseurAudio < maintenant + 0.02) curseurAudio = maintenant + 0.06
  if (curseurAudio > maintenant + 0.3) curseurAudio = maintenant + 0.1
  source.start(curseurAudio)
  curseurAudio += tampon.duration
}

function redessiner() {
  if (gb.ppu.couleur) {
    for (let i = 0; i < 160 * 144; i++) {
      const c = gb.ppu.couleurs[i]
      image.data[i * 4] = huitBits(c & 31)
      image.data[i * 4 + 1] = huitBits((c >> 5) & 31)
      image.data[i * 4 + 2] = huitBits((c >> 10) & 31)
      image.data[i * 4 + 3] = 255
    }
  } else {
    for (let i = 0; i < 160 * 144; i++) {
      const [r, v, b] = NUANCES[gb.framebuffer[i] & 3]
      image.data[i * 4] = r
      image.data[i * 4 + 1] = v
      image.data[i * 4 + 2] = b
      image.data[i * 4 + 3] = 255
    }
  }
  ctx.putImageData(image, 0, 0)
}

const TOUCHES = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyX: 'a', KeyZ: 'b', Enter: 'start', ShiftLeft: 'select', ShiftRight: 'select',
}

addEventListener('keydown', (e) => {
  const bouton = TOUCHES[e.code]
  if (!bouton) return
  e.preventDefault()
  gb.setButton(bouton, true)
})
addEventListener('keyup', (e) => {
  const bouton = TOUCHES[e.code]
  if (!bouton) return
  e.preventDefault()
  gb.setButton(bouton, false)
})
addEventListener('pointerdown', ouvrirLeSon, { once: true })
addEventListener('keydown', ouvrirLeSon, { once: true })

function tick() {
  requestAnimationFrame(tick)
  gb.runFrame()
  verserLeSon()
  redessiner()
}
tick()
</script>
